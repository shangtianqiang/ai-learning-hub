<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a89"/></marker></defs>
<style>
text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1f2d2c}
.h{font-size:16px;font-weight:600}
.b{font-size:13px}
.s{font-size:11.5px;fill:#5b6b6a}
</style>

<text x="450" y="48" text-anchor="middle" class="h">多模态应用：理解、推理、生成三段协作</text>
<rect x="50" y="80" width="240" height="150" rx="12" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.4"/>
<text x="170" y="110" text-anchor="middle" class="h">输入</text>
<text x="170" y="140" text-anchor="middle" class="b">📷 图片 / 🎬 视频（抽帧）</text>
<text x="170" y="168" text-anchor="middle" class="b">📄 文本 / 🎙 语音（ASR 转写）</text>
<text x="170" y="200" text-anchor="middle" class="s">语音是生物特征，合规要求更高</text>
<rect x="340" y="80" width="220" height="150" rx="12" fill="#f9efe4" stroke="#c47f3d" stroke-width="1.4"/>
<text x="450" y="110" text-anchor="middle" class="h">理解与推理</text>
<text x="450" y="140" text-anchor="middle" class="b">VLM 读图 → 结构化输出</text>
<text x="450" y="168" text-anchor="middle" class="b">LLM 汇总与决策</text>
<text x="450" y="200" text-anchor="middle" class="s">数字字段交给代码校验</text>
<rect x="610" y="80" width="240" height="150" rx="12" fill="#e6f0e9" stroke="#4d6b50" stroke-width="1.4"/>
<text x="730" y="110" text-anchor="middle" class="h">生成与输出</text>
<text x="730" y="140" text-anchor="middle" class="b">文生图 / 文生视频</text>
<text x="730" y="168" text-anchor="middle" class="b">TTS 语音合成</text>
<text x="730" y="200" text-anchor="middle" class="s">生成内容必须过安全审核</text>
<line x1="292" y1="155" x2="336" y2="155" stroke="#7a8a89" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="562" y1="155" x2="606" y2="155" stroke="#7a8a89" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="50" y="260" width="800" height="118" rx="12" fill="#fafaf8" stroke="#d8e2e1"/>
<text x="74" y="290" class="h">成本三旋钮（按重要性排序）</text>
<text x="74" y="318" class="b">① 输入规模：砍掉不必要的分辨率/时长，立竿见影且用户无感</text>
<text x="74" y="344" class="b">② 输出规模：预览用小模型，确认后高清重生成　③ 单价：模型分级路由</text>
<text x="74" y="368" class="s">例外：支付凭证、证件识别等低容错场景，质量投入是刚性成本，不能降。</text>

</svg>