<rect x="130" y="330" width="640" height="88" rx="10" fill="#fafaf8" stroke="#d8e2e1"/>
<text x="150" y="360" class="b">学习率决定步子大小：太大会震荡不收敛，太小收敛慢。</text>
<text x="150" y="390" class="b">SGD → 动量 → Adam：逐步叠加「历史梯度」信息，走得又稳又快。</text>

