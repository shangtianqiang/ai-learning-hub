<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a89"/></marker></defs>
<style>
text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1f2d2c}
.h{font-size:16px;font-weight:600}
.b{font-size:13px}
.s{font-size:11.5px;fill:#5b6b6a}
.dim{fill:#5b6b6a}
.w{fill:#ffffff}
</style>

<text x="450" y="60" text-anchor="middle" class="h">自注意力：每个词都「看一眼」句子里所有的词</text>
<text x="450" y="84" text-anchor="middle" class="s">「它」指谁？注意力权重会给出答案</text>
<rect x="120" y="120" width="150" height="52" rx="9" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.5"/><text x="195" y="152" text-anchor="middle" class="h">动物</text>
<rect x="390" y="120" width="120" height="52" rx="9" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.5"/><text x="450" y="152" text-anchor="middle" class="h">没有</text>
<rect x="640" y="120" width="140" height="52" rx="9" fill="#f9efe4" stroke="#c47f3d" stroke-width="1.5"/><text x="710" y="152" text-anchor="middle" class="h">它</text>
<line x1="705" y1="120" x2="215" y2="176" stroke="#0f5f5c" stroke-width="5" opacity="0.85"/>
<line x1="710" y1="128" x2="455" y2="172" stroke="#0f5f5c" stroke-width="1.4" opacity="0.5"/>
<text x="452" y="136" text-anchor="middle" class="s" fill="#0f5f5c">权重高：它 → 动物</text>
<text x="590" y="196" text-anchor="middle" class="s">权重低</text>
<text x="450" y="245" text-anchor="middle" class="b">每个词生成三种向量：Q（我要找什么）· K（我有什么特征）· V（我的内容）</text>
<rect x="120" y="280" width="660" height="120" rx="12" fill="#fafaf8" stroke="#d8e2e1"/>
<rect x="150" y="312" width="170" height="56" rx="9" fill="#eaf3f2" stroke="#0f5f5c"/><text x="235" y="346" text-anchor="middle" class="b">Q · K 打分</text>
<rect x="390" y="312" width="170" height="56" rx="9" fill="#eaf3f2" stroke="#0f5f5c"/><text x="475" y="346" text-anchor="middle" class="b">softmax 归一化</text>
<rect x="630" y="312" width="120" height="56" rx="9" fill="#eaf3f2" stroke="#0f5f5c"/><text x="690" y="346" text-anchor="middle" class="b">加权 V</text>
<line x1="322" y1="340" x2="386" y2="340" stroke="#7a8a89" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="562" y1="340" x2="626" y2="340" stroke="#7a8a89" stroke-width="1.5" marker-end="url(#arw)"/>
<text x="450" y="432" text-anchor="middle" class="s">多头注意力：并行做多次上述过程，各自关注不同模式（语法/指代/语义）</text>

</svg>