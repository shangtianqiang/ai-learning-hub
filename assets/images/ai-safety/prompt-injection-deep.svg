<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a89"/></marker></defs>
<style>
text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1f2d2c}
.h{font-size:16px;font-weight:600}
.b{font-size:13px}
.s{font-size:11.5px;fill:#5b6b6a}
</style>

<text x="450" y="48" text-anchor="middle" class="h">间接注入：用户看不见的下毒</text>
<rect x="60" y="86" width="200" height="120" rx="10" fill="#f7e9e7" stroke="#9e3b32" stroke-width="1.4"/>
<text x="160" y="116" text-anchor="middle" class="h">攻击者</text>
<text x="160" y="142" text-anchor="middle" class="b">在网页/邮件/文档里</text>
<text x="160" y="164" text-anchor="middle" class="b">埋一句恶意指令</text>
<rect x="330" y="86" width="200" height="120" rx="10" fill="#fafaf8" stroke="#c9d6d5" stroke-width="1.4"/>
<text x="430" y="116" text-anchor="middle" class="h">Agent 检索内容</text>
<text x="430" y="142" text-anchor="middle" class="b">恶意指令随材料一起</text>
<text x="430" y="164" text-anchor="middle" class="b">进入上下文，用户不知情</text>
<rect x="600" y="86" width="200" height="120" rx="10" fill="#f7e9e7" stroke="#9e3b32" stroke-width="1.4"/>
<text x="700" y="116" text-anchor="middle" class="h">模型被注入</text>
<text x="700" y="142" text-anchor="middle" class="b">把「数据」当成「指令」</text>
<text x="700" y="164" text-anchor="middle" class="b">执行外发/删除等动作</text>
<line x1="262" y1="146" x2="326" y2="146" stroke="#9e3b32" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="532" y1="146" x2="596" y2="146" stroke="#9e3b32" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="60" y="240" width="740" height="120" rx="12" fill="#e6f0e9" stroke="#4d6b50" stroke-width="1.3"/>
<text x="84" y="270" class="h">与直接注入的区别</text>
<text x="84" y="298" class="b">直接注入发生在用户自己的对话框里；间接注入由第三方在「模型会读到的内容」里下毒，攻击静默发生，危害更大。</text>
<text x="84" y="326" class="s">多模态扩大了攻击面：图片角落里的一行小字，也是一条指令。</text>
<rect x="60" y="376" width="740" height="60" rx="10" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.3"/>
<text x="84" y="400" class="b">没有银弹，只有纵深：最小权限 · 来源标注与指令过滤 · 高危操作人工确认 · 输出审查</text>
<text x="84" y="422" class="s">系统设计要默认「模型可能被注入」，靠架构兜住最坏情况。</text>

</svg>