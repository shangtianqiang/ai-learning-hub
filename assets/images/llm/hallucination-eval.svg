<text x="450" y="52" text-anchor="middle" class="h">幻觉长什么样：一本正经地编造</text>
<rect x="120" y="80" width="660" height="56" rx="12" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.4"/>
<text x="146" y="113" class="b">用户：公司《差旅报销制度》里，住宿标准是多少？</text>
<rect x="120" y="150" width="660" height="150" rx="12" fill="#fafaf8" stroke="#c9d6d5" stroke-width="1.4"/>
<text x="146" y="182" class="b" fill="#5b6b6a">助手：</text>
<text x="146" y="212" class="b">根据《差旅报销制度》第 7.2 条，一线城市住宿</text>
<text x="146" y="240" class="b">标准为每晚 800 元，超支部分需部门总监审批。</text>
<rect x="146" y="258" width="330" height="30" rx="6" fill="#f7e9e7"/>
<text x="160" y="279" class="b" fill="#9e3b32">⚠ 实际核查：制度里根本没有「第 7.2 条」</text>
<rect x="120" y="322" width="660" height="86" rx="12" fill="#f9efe4" stroke="#c47f3d" stroke-width="1.3"/>
<text x="146" y="352" class="b">为什么危险：语气流畅、格式像模像样，还有一个「看起来可信」的条款编号。</text>
<text x="146" y="380" class="b">对策：接 RAG 提供依据 + 允许模型说「不知道」+ 关键结论强制引用原文。</text>

</svg>