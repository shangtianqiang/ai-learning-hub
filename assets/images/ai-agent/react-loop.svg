<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a89"/></marker></defs>
<style>
text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1f2d2c}
.h{font-size:16px;font-weight:600}
.b{font-size:13px}
.s{font-size:11.5px;fill:#5b6b6a}
</style>

<text x="450" y="48" text-anchor="middle" class="h">ReAct 循环：思考 → 行动 → 观察，直到达成目标</text>
<rect x="330" y="76" width="240" height="46" rx="23" fill="#f2efe9" stroke="#7a6340" stroke-width="1.4"/>
<text x="450" y="105" text-anchor="middle" class="b">用户任务：「查上海明天天气并给建议」</text>
<line x1="450" y1="124" x2="450" y2="158" stroke="#7a8a89" stroke-width="1.5" marker-end="url(#arw)"/>
<circle cx="450" cy="290" r="118" fill="none" stroke="#c9d6d5" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="360" y="176" width="180" height="66" rx="12" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.5"/>
<text x="450" y="204" text-anchor="middle" class="h">思考 Thought</text>
<text x="450" y="226" text-anchor="middle" class="s">「需要调天气工具」</text>
<rect x="556" y="252" width="190" height="66" rx="12" fill="#f9efe4" stroke="#c47f3d" stroke-width="1.5"/>
<text x="651" y="280" text-anchor="middle" class="h">行动 Action</text>
<text x="651" y="302" text-anchor="middle" class="s">get_weather(上海, 明天)</text>
<rect x="360" y="340" width="180" height="66" rx="12" fill="#e8eef5" stroke="#3d5a80" stroke-width="1.5"/>
<text x="450" y="368" text-anchor="middle" class="h">观察 Observation</text>
<text x="450" y="390" text-anchor="middle" class="s">小雨 18-24°C</text>
<rect x="150" y="252" width="190" height="66" rx="12" fill="#fafaf8" stroke="#c9d6d5" stroke-width="1.5"/>
<text x="245" y="280" text-anchor="middle" class="h">继续思考</text>
<text x="245" y="302" text-anchor="middle" class="s">结果不够？换工具/再查</text>
<path d="M452,174 C520,160 580,200 630,246" fill="none" stroke="#c47f3d" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M640,320 C620,368 540,392 486,382" fill="none" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M356,368 C280,360 230,330 226,322" fill="none" stroke="#7a8a89" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M240,250 C260,206 310,180 354,176" fill="none" stroke="#0f5f5c" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="700" y="150" width="170" height="60" rx="10" fill="#e6f0e9" stroke="#4d6b50" stroke-width="1.4"/>
<text x="785" y="176" text-anchor="middle" class="b">信息足够</text><text x="785" y="196" text-anchor="middle" class="s">→ 输出最终回答</text>
<line x1="672" y1="182" x2="696" y2="180" stroke="#4d6b50" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="60" y="430" width="800" height="56" rx="10" fill="#fafaf8" stroke="#d8e2e1"/>
<text x="84" y="454" class="b">循环有效的原因：工具的真实反馈会回流进上下文，模型能边做边修正——而不是一次性猜完。</text>
<text x="84" y="476" class="s">务必设循环上限与终止条件，防止无限打转；工具幻觉与死循环由 Harness 层兜底（下一门课细讲）。</text>

</svg>