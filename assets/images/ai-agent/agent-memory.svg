<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a89"/></marker></defs>
<style>
text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1f2d2c}
.h{font-size:16px;font-weight:600}
.b{font-size:13px}
.s{font-size:11.5px;fill:#5b6b6a}
</style>

<text x="450" y="48" text-anchor="middle" class="h">Agent 的记忆与组件：状态卡是最实用的一层</text>
<rect x="60" y="80" width="250" height="300" rx="12" fill="#eaf3f2" stroke="#0f5f5c" stroke-width="1.4"/>
<text x="185" y="114" text-anchor="middle" class="h">任务状态卡（推荐）</text>
<rect x="84" y="136" width="202" height="86" rx="8" fill="#fff" stroke="#c9d6d5"/>
<text x="100" y="162" class="b">目标：调研 Agent 落地现状</text>
<text x="100" y="186" class="b">已完成：① 主流产品 ② 定价</text>
<text x="100" y="210" class="b">待办：③ 失败案例</text>
<text x="185" y="256" text-anchor="middle" class="s">每轮更新，体积小、信息全</text>
<text x="185" y="280" text-anchor="middle" class="s">崩溃可恢复，人工可审计</text>
<text x="185" y="344" text-anchor="middle" class="s">替代「保留全部历史」：省钱</text>
<text x="185" y="364" text-anchor="middle" class="s">且不丢关键信息</text>
<rect x="360" y="80" width="230" height="300" rx="12" fill="#fafaf8" stroke="#c9d6d5" stroke-width="1.3"/>
<text x="475" y="114" text-anchor="middle" class="h">上下文窗口（一次性）</text>
<rect x="384" y="132" width="182" height="40" rx="7" fill="#eaf3f2"/><text x="475" y="157" text-anchor="middle" class="b">系统提示</text>
<rect x="384" y="178" width="182" height="40" rx="7" fill="#f9efe4"/><text x="475" y="203" text-anchor="middle" class="b">注入的记忆（设配额）</text>
<rect x="384" y="224" width="182" height="40" rx="7" fill="#eaf3f2"/><text x="475" y="249" text-anchor="middle" class="b">工具调用结果</text>
<rect x="384" y="270" width="182" height="40" rx="7" fill="#f2efe9"/><text x="475" y="295" text-anchor="middle" class="b">旧对话摘要压缩</text>
<text x="475" y="344" text-anchor="middle" class="s">超出窗口的内容会被截断，</text>
<text x="475" y="364" text-anchor="middle" class="s">所以要做取舍与压缩</text>
<rect x="640" y="80" width="220" height="300" rx="12" fill="#f2efe9" stroke="#7a6340" stroke-width="1.3"/>
<text x="750" y="114" text-anchor="middle" class="h">长期记忆（跨会话）</text>
<rect x="664" y="136" width="172" height="40" rx="7" fill="#fff" stroke="#a3926b"/><text x="750" y="161" text-anchor="middle" class="b">抽取事实条目</text>
<rect x="664" y="184" width="172" height="40" rx="7" fill="#fff" stroke="#a3926b"/><text x="750" y="209" text-anchor="middle" class="b">向量库存档</text>
<rect x="664" y="232" width="172" height="40" rx="7" fill="#fff" stroke="#a3926b"/><text x="750" y="257" text-anchor="middle" class="b">按相关度取 top-k</text>
<rect x="664" y="280" width="172" height="40" rx="7" fill="#f7e9e7" stroke="#9e3b32"/><text x="750" y="305" text-anchor="middle" class="b">过期信息要清理</text>
<text x="750" y="344" text-anchor="middle" class="s">难点是「记什么、何时更新」，</text>
<text x="750" y="364" text-anchor="middle" class="s">不是「存在哪」</text>

</svg>