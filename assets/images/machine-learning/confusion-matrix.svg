<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a89"/></marker></defs>
<style>
text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1f2d2c}
.h{font-size:16px;font-weight:600}
.b{font-size:13px}
.s{font-size:11.5px;fill:#5b6b6a}
.dim{fill:#5b6b6a}
.w{fill:#ffffff}
</style>

<text x="255" y="70" text-anchor="middle" class="h">混淆矩阵：把预测结果装进四个格子</text>
<text x="150" y="112" class="s">预测：阳性</text><text x="360" y="112" class="s">预测：阴性</text>
<text x="52" y="180" transform="rotate(-90 52 180)" text-anchor="middle" class="s">真实：阳性</text>
<text x="52" y="290" transform="rotate(-90 52 290)" text-anchor="middle" class="s">真实：阴性</text>
<rect x="80" y="125" width="185" height="105" rx="10" fill="#e6f0e9" stroke="#4d6b50" stroke-width="1.5"/>
<text x="172" y="168" text-anchor="middle" class="h">TP 真阳性</text><text x="172" y="192" text-anchor="middle" class="b">判对了，确实是</text>
<rect x="272" y="125" width="185" height="105" rx="10" fill="#f7e9e7" stroke="#9e3b32" stroke-width="1.5"/>
<text x="364" y="168" text-anchor="middle" class="h">FN 假阴性</text><text x="364" y="192" text-anchor="middle" class="b">漏报，最危险</text>
<rect x="80" y="238" width="185" height="105" rx="10" fill="#f7e9e7" stroke="#9e3b32" stroke-width="1.5"/>
<text x="172" y="281" text-anchor="middle" class="h">FP 假阳性</text><text x="172" y="305" text-anchor="middle" class="b">误报，虚惊一场</text>
<rect x="272" y="238" width="185" height="105" rx="10" fill="#e6f0e9" stroke="#4d6b50" stroke-width="1.5"/>
<text x="364" y="281" text-anchor="middle" class="h">TN 真阴性</text><text x="364" y="305" text-anchor="middle" class="b">判对了，确实不是</text>
<line x1="500" y1="240" x2="545" y2="240" stroke="#7a8a89" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="560" y="125" width="310" height="218" rx="10" fill="#fafaf8" stroke="#d8e2e1"/>
<text x="580" y="158" class="h">常用指标（都从四格算出）</text>
<text x="580" y="192" class="b">准确率：(TP+TN) / 全部</text>
<text x="580" y="222" class="b">精确率：TP / (TP+FP)　报出来的有多准</text>
<text x="580" y="252" class="b">召回率：TP / (TP+FN)　该抓的抓住了多少</text>
<text x="580" y="282" class="b">F1：精确率与召回率的调和平均</text>
<text x="580" y="318" class="s">类别不平衡时，准确率会骗人，看精确率/召回率。</text>

</svg>