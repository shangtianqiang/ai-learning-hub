<rect x="640" y="165" width="70" height="40" rx="8" fill="#fff" stroke="#9e3b32"/><text x="675" y="190" text-anchor="middle" class="b">智能体</text>
<rect x="750" y="165" width="70" height="40" rx="8" fill="#fff" stroke="#9e3b32"/><text x="785" y="190" text-anchor="middle" class="b">环境</text>
<line x1="712" y1="178" x2="748" y2="178" stroke="#9e3b32" stroke-width="1.4" marker-end="url(#arw)"/>
<line x1="748" y1="196" x2="712" y2="196" stroke="#9e3b32" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="730" y="165" text-anchor="middle" class="s">动作</text><text x="730" y="215" text-anchor="middle" class="s">奖励</text>
