<text x="110" y="172" text-anchor="middle" class="s">标签 A</text><text x="243" y="177" text-anchor="middle" class="s">标签 B</text>
<text x="170" y="275" text-anchor="middle" class="b">输入 + 正确答案</text>
<text x="170" y="300" text-anchor="middle" class="b">学会「输入 → 输出」</text>
<text x="170" y="345" text-anchor="middle" class="s">例：垃圾邮件分类</text>
<rect x="320" y="60" width="260" height="330" rx="12" fill="#f2efe9" stroke="#7a6340" stroke-width="1.4"/>
