<ellipse cx="413" cy="198" rx="45" ry="38" fill="none" stroke="#7a6340" stroke-dasharray="4 4"/>
<ellipse cx="521" cy="198" rx="45" ry="38" fill="none" stroke="#a3926b" stroke-dasharray="4 4"/>
<text x="450" y="275" text-anchor="middle" class="b">只有输入数据</text>
